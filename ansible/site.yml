---
- name: Converge the baseline
  hosts: all
  become: true
  gather_facts: true

  pre_tasks:
    - name: Confirm this box came from cloud-init, not from someone's fingers
      ansible.builtin.stat:
        path: /etc/baseline-bootstrap
      register: bootstrap_marker

    - name: Fail loudly if the marker is missing
      ansible.builtin.fail:
        msg: >-
          /etc/baseline-bootstrap is missing. This host was not built from this
          repository, so converging it would hide a manual step rather than remove one.
      when: not bootstrap_marker.stat.exists

    # Without this the firewall flip-flops: baseline opens public SSH, the tailscale
    # role closes it again, and every run reports two changes forever. Asking the box
    # what state it is already in makes the second run a no-op, which is the whole
    # point of idempotence.
    - name: Check whether the tailnet is already up
      ansible.builtin.command: tailscale status --json
      register: ts_precheck
      changed_when: false
      failed_when: false

    - name: Keep public SSH open only while there is no other way in
      ansible.builtin.set_fact:
        baseline_allow_public_ssh: >-
          {{ ts_precheck.rc != 0
             or (ts_precheck.stdout | default('{}') | from_json).BackendState | default('') != 'Running' }}

  roles:
    - baseline
    - docker
    - tailscale
    - restic
    - monitoring
