---
restic_version: "0.17.3"
# Checksum from the release page. get_url refuses the file if it does not match,
# which is the whole reason this is not a pipe into a shell.
restic_sha256: "REPLACE_WITH_RELEASE_SHA256"
restic_arch: "{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}"
restic_repository: ""
restic_backup_paths:
  - /etc
  - /srv
  - /var/lib/baseline
restic_exclude_patterns:
  - "*.tmp"
  - "/var/lib/baseline/restore-test"
restic_keep_daily: 7
restic_keep_weekly: 4
restic_schedule: "daily"
restic_max_age_hours: 26
